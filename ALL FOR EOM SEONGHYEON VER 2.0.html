<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ALL FOR EOM SEONGHYEON VER 2.0</title>
<style>
:root{color-scheme:light dark;--bg:#fff7f0;--card:#fff;--ink:#3b2417;--muted:#8a6a58;--orange:#ff7a1a;--soft:#ffe8d4;--line:#ffd3ad}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:auto;padding:16px}h1{font-size:20px;color:var(--orange);margin:0}header{display:flex;justify-content:space-between;align-items:center}.stats,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);text-align:center;gap:8px}.stats b{display:block;color:var(--orange);font-size:20px}nav{display:flex;gap:7px;overflow:auto;padding:3px 0 8px}nav button,button,select,textarea{font:inherit}nav button{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 13px;font-weight:700}nav button.active,.primary{background:var(--orange);color:white;border-color:var(--orange)}button{cursor:pointer;border:0;border-radius:11px;padding:9px 13px;font-weight:700}.primary{background:linear-gradient(135deg,#ff7a1a,#ffb36b)}.secondary{background:var(--soft);color:var(--orange)}button:disabled{opacity:.5}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.caption{background:var(--soft);padding:13px;border-radius:12px;min-height:64px;white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0}select,textarea{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;max-width:100%}textarea{width:100%;margin:8px 0}.muted{color:var(--muted);font-size:13px}.bar{height:9px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--orange)}.item{padding:9px 0;border-top:1px solid var(--line)}.tag{display:inline-block;background:var(--soft);color:var(--orange);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:700}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--orange);color:white;border-radius:99px;padding:9px 16px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.dock{position:fixed;right:12px;bottom:12px;z-index:3}.player{width:min(320px,calc(100vw - 24px));background:var(--card);border:1px solid var(--line);padding:10px;border-radius:14px;margin-bottom:8px}.player iframe{width:100%;height:180px;border:0;border-radius:10px}.player[hidden]{display:none}a{color:var(--orange)}@media(prefers-color-scheme:dark){:root{--bg:#1d130c;--card:#2a1a10;--ink:#fff1e6;--muted:#d1ab92;--soft:#3d2615;--line:#5a3a22}}
</style>
</head>
<body><div class="wrap"><header><h1>🧡 ALL FOR EOM SEONGHYEON VER 2.0</h1></header><div class="stats" id="stats"></div><div class="card" id="notice"></div><nav id="nav"></nav><main id="view"></main><p class="muted">Dữ liệu được lưu trên trình duyệt này (localStorage); không có đăng nhập hoặc đồng bộ máy chủ.</p></div><div class="dock"><div class="player" id="player" hidden><div class="muted">🎧 SEONGHYEON playlist · phát nhạc cần Internet</div><iframe id="yt" title="SEONGHYEON playlist" allow="autoplay; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe><a target="_blank" rel="noopener" href="https://www.youtube.com/playlist?list=PLq1T7LUE88u4IxwwYNDPMZq3U72u1oH5X">Mở playlist trên YouTube ↗</a></div><button class="primary" id="music">🎧 Playlist</button></div><div class="toast" id="toast"></div>
<script>
const KEY='eom-seonghyeon-local-v2',cats=['Ủng hộ','Cảm ơn','Chúc mừng'];
const captions=[
{id:1,l:'en',c:'Ủng hộ',t:'Eom Seonghyeon, every role you play feels like a new world. Proud to support you!'},
{id:2,l:'en',c:'Cảm ơn',t:'Thank you, Eom Seonghyeon, for the warmth and heart you bring to every scene.'},
{id:3,l:'en',c:'Chúc mừng',t:'Congratulations, Eom Seonghyeon! Your hard work shines brighter every day.'},
{id:4,l:'ko',c:'Ủng hộ',t:'엄성현, 맡는 역마다 새로운 세계를 보여줘서 고마워요. 항상 응원해요!'},
{id:5,l:'ko',c:'Cảm ơn',t:'모든 장면에 따뜻한 마음을 담아줘서 고마워요, 엄성현.'},
{id:6,l:'ko',c:'Chúc mừng',t:'축하해요, 엄성현! 당신의 노력이 날마다 더 빛나요.'}];
const comments={Instagram:['Seonghyeon, your smile lights up every frame. Cheering for you always! 🧡','엄성현 화이팅! 항상 응원하고 있어요 🧡','Every role you take feels so sincere. Proud of you, Seonghyeon!'],X:['Eom Seonghyeon is a talent worth watching. Keep shining! 🧡 #EomSeonghyeon','엄성현 배우님 오늘도 응원합니다! #엄성현'],YouTube:['Seonghyeon, thank you for always giving your best. We are so proud of you! 🧡','Sending lots of love from Vietnam. Please stay healthy and keep shining!']};
let state={tab:'Caption',lang:'en',cat:'all',current:1,favs:[],xp:0,copies:0,comments:0,submitted:[],approved:[],commentSite:'Instagram',commentIndex:0,eventCount:0,joined:false,notice:'Chào mừng đến trạm ủng hộ Seonghyeon 🧡'};
try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function choose(){let pool=[...captions,...state.approved].filter(x=>x.l===state.lang&&(state.cat==='all'||x.c===state.cat));if(pool.length){state.current=pool[Math.floor(Math.random()*pool.length)].id;save()}}
function current(){return [...captions,...state.approved].find(x=>x.id===state.current)}
async function copyText(text){try{await navigator.clipboard.writeText(text)}catch(e){const a=document.createElement('textarea');a.value=text;document.body.append(a);a.select();document.execCommand('copy');a.remove()}toast('Đã copy vào clipboard')}
const tabs=['Caption','Bình luận','Sự kiện','Đóng góp','Hồ sơ'];
function render(){ $('#stats').innerHTML=`<div><b>${state.copies}</b>lượt copy trên máy này</div><div><b>${state.submitted.length}</b>caption đóng góp</div>`;$('#notice').innerHTML='📣 '+esc(state.notice);$('#nav').innerHTML=tabs.map(t=>`<button class="${state.tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;save();render()});
 const views={Caption:captionView,'Bình luận':commentView,'Sự kiện':eventView,'Đóng góp':contributionView,'Hồ sơ':profileView};$('#view').innerHTML=views[state.tab]();bind()}
function captionView(){const c=current();return `<section class="card"><div class="row"><select id="lang"><option value="en">🇬🇧 English</option><option value="ko">🇰🇷 한국어</option></select><select id="category"><option value="all">Mọi danh mục</option>${cats.map(x=>`<option value="${x}">${x}</option>`).join('')}</select></div><div class="caption">${c?esc(c.t):'Không có caption phù hợp.'}</div><b style="color:var(--orange)">#EomSeonghyeon #엄성현</b><div class="row" style="margin-top:10px"><button class="primary" id="copyCaption" ${c?'':'disabled'}>Copy caption</button><button class="secondary" id="random">Random</button><button class="secondary" id="favorite">${c&&state.favs.includes(c.id)?'💛 Đã lưu':'🤍 Yêu thích'}</button></div><p class="muted">Caption yêu thích và hoạt động chỉ lưu trên trình duyệt hiện tại.</p></section>`}
function commentView(){const site=state.commentSite,list=comments[site],i=state.commentIndex%list.length;return `<section class="card"><h3>Bình luận · ${esc(site)}</h3><div class="row">${Object.keys(comments).map(s=>`<button class="${s===site?'primary':'secondary'}" data-site="${s}">${s}</button>`).join('')}</div><div class="caption">${esc(list[i])}</div><p class="muted">${i+1}/${list.length} · Công cụ chỉ copy, không tự đăng.</p><div class="row"><button class="primary" id="copyComment">Copy bình luận</button><button class="secondary" id="nextComment">Câu tiếp ›</button><button class="secondary" id="randomComment">Random</button></div></section>`}
function eventView(){return `<section class="card"><h3>🎤 Sự kiện ủng hộ</h3><span class="tag">Hoạt động nội bộ</span><p>Cùng gửi lời động viên tích cực đến Eom Seonghyeon. Hãy đăng tự nhiên, tránh lặp nội dung liên tục.</p><div class="caption">SEONGHYEON REIGNS OVER MAMA\n#SEONGHYEONStageRoyalty #SEONGHYEON #성현</div><div class="row"><button class="primary" id="copyEvent">Copy tagline + hashtag</button><button class="secondary" id="join">${state.joined?'Đã tham gia ✓':'Tham gia'}</button></div><p class="muted">Đã copy tagline ${state.eventCount} lần trên thiết bị này.</p><a href="https://www.youtube.com/playlist?list=PLq1T7LUE88u4IxwwYNDPMZq3U72u1oH5X" target="_blank" rel="noopener">Mở playlist ↗</a></section>`}
function contributionView(){return `<section class="card"><h3>Gửi caption đóng góp</h3><p class="muted">Đóng góp được lưu chờ duyệt trên thiết bị này; không tự chia sẻ với người khác.</p><div class="row"><select id="subLang"><option value="en">English</option><option value="ko">한국어</option></select><select id="subCat">${cats.map(x=>`<option>${x}</option>`).join('')}</select></div><textarea id="subText" rows="3" placeholder="Viết caption của bạn"></textarea><button class="primary" id="submit">Lưu đóng góp</button>${state.submitted.map((x,i)=>`<div class="item">${esc(x.t)} <span class="tag">${x.l.toUpperCase()} · ${esc(x.c)}</span> <button class="secondary" data-delete="${i}">Xóa</button></div>`).join('')||'<p class="muted">Chưa có nội dung đóng góp.</p>'}</section>`}
function profileView(){return `<section class="card"><h3>Hồ sơ trên thiết bị này</h3><p><b>${state.xp} XP</b> · Level ${Math.floor(state.xp/100)+1}</p><div class="bar"><i style="width:${state.xp%100}%"></i></div><p>Đã copy: ${state.copies} · Yêu thích: ${state.favs.length} · Comment: ${state.comments}</p><h3>Caption yêu thích</h3>${state.favs.map(id=>{const c=[...captions,...state.approved].find(x=>x.id===id);return c?`<div class="item">${esc(c.t)}</div>`:''}).join('')||'<span class="muted">Chưa lưu caption yêu thích.</span>'}<hr><button class="secondary" id="reset">Xóa dữ liệu cục bộ</button></section>`}
function bind(){const lang=$('#lang');if(lang){lang.value=state.lang;$('#category').value=state.cat;lang.onchange=e=>{state.lang=e.target.value;choose();render()};$('#category').onchange=e=>{state.cat=e.target.value;choose();render()};$('#copyCaption').onclick=()=>{const c=current();if(c){copyText(c.t+'\n\n#EomSeonghyeon #엄성현');state.copies++;state.xp+=5;save();render()}};$('#random').onclick=()=>{choose();render()};$('#favorite').onclick=()=>{const c=current();if(c){state.favs=state.favs.includes(c.id)?state.favs.filter(x=>x!==c.id):[...state.favs,c.id];save();render()}}}
 document.querySelectorAll('[data-site]').forEach(b=>b.onclick=()=>{state.commentSite=b.dataset.site;state.commentIndex=0;save();render()});if($('#copyComment'))$('#copyComment').onclick=()=>{copyText(comments[state.commentSite][state.commentIndex%comments[state.commentSite].length]);state.comments++;state.copies++;state.xp+=3;save();render()};if($('#nextComment'))$('#nextComment').onclick=()=>{state.commentIndex=(state.commentIndex+1)%comments[state.commentSite].length;save();render()};if($('#randomComment'))$('#randomComment').onclick=()=>{state.commentIndex=Math.floor(Math.random()*comments[state.commentSite].length);save();render()};if($('#copyEvent'))$('#copyEvent').onclick=()=>{copyText('SEONGHYEON REIGNS OVER MAMA\n#SEONGHYEONStageRoyalty #SEONGHYEON #성현');state.eventCount++;state.copies++;state.xp+=5;save();render()};if($('#join'))$('#join').onclick=()=>{state.joined=true;save();render()};if($('#submit'))$('#submit').onclick=()=>{const t=$('#subText').value.trim();if(!t)return toast('Hãy nhập caption trước');state.submitted.unshift({id:Date.now(),l:$('#subLang').value,c:$('#subCat').value,t});save();toast('Đã lưu caption');render()};document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{state.submitted.splice(+b.dataset.delete,1);save();render()});if($('#reset'))$('#reset').onclick=()=>{if(confirm('Xóa toàn bộ dữ liệu đã lưu trên trình duyệt này?')){localStorage.removeItem(KEY);location.reload()}}}
$('#music').onclick=()=>{const p=$('#player');p.hidden=!p.hidden;if(!$('#yt').src)$('#yt').src='https://www.youtube.com/embed/videoseries?list=PLq1T7LUE88u4IxwwYNDPMZq3U72u1oH5X&autoplay=1&loop=1'};
if(!current())choose();render();
</script></body></html>
